name: Promote stable release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Promote the current next release to npm latest
        required: true
        type: choice
        options:
          - Promote to latest

concurrency:
  group: promote-stable
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Create stable promotion PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Prepare stable version
        run: |
          node -e "const fs=require('node:fs'); const path='.changeset/pre.json'; if (!fs.existsSync(path) || JSON.parse(fs.readFileSync(path, 'utf8')).mode !== 'pre') throw new Error('The repository is not currently in prerelease mode.');"
          npm run changeset -- pre exit
          npm run version-packages

      - name: Open stable promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release/promote-stable-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git commit -m "chore: promote next to latest"
          git push origin "$branch"
          gh label create "release:latest" --color "0e8a16" --description "Publishes to the npm latest tag" --force
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: promote next to latest" \
            --label "release:latest" \
            --body "Promotes the current prerelease to a stable npm release. Merging this PR publishes the version under the \`latest\` tag and creates its GitHub release."
