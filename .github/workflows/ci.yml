name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:check

  production-integration:
    name: Production integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: .playground
      - run: npm run build
        working-directory: .playground

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.labels.*.name, 'release:skip')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git fetch origin main:main
      - name: Require a changeset file in this PR
        run: |
          files="$(git diff --name-only --diff-filter=AM origin/main...HEAD -- '.changeset/*.md' ':(exclude).changeset/README.md')"
          if [ -z "$files" ]; then
            echo "Add a changeset with 'npm run changeset' or apply the release:skip label."
            exit 1
          fi
      - run: npx changeset status --output=.changeset/status.json
      - name: Require a package release
        run: >-
          node -e "const status=require('./.changeset/status.json');
          if (!status.releases?.length) {
          throw new Error('Add a changeset or apply the release:skip label.'); }"
