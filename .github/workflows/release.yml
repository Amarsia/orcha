name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use current npm with trusted publishing support
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run build

      - name: Detect release channel
        id: channel
        run: node .github/scripts/release-channel.mjs

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: release ${{ steps.channel.outputs.name }}"
          title: "chore: release ${{ steps.channel.outputs.name }}"
          createGithubReleases: true
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label the release PR
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          label="release:$RELEASE_CHANNEL"
          gh label create "$label" --color "6f42c1" --description "Publishes to the npm $RELEASE_CHANNEL tag" --force
          pr_number="$(gh pr list --head "changeset-release/main" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --add-label "$label"
          fi
